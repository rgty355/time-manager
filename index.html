<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeManager OS Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --app-bg: #131722;
      --app-accent: #6366f1;
    }
    body {
      background-color: var(--app-bg) !important;
      transition: background-color 0.3s ease;
    }
    .app-card {
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
  </style>
</head>
<body id="appBody" class="text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header Top Bar -->
  <header class="border-b border-white/10 bg-black/50 backdrop-blur-xl sticky top-0 z-50 px-4 md:px-8 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg">⚡</div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-bold text-white">TimeManager OS</h1>
          <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">PRO IA</span>
        </div>
        <p class="text-[11px] text-slate-400">Espace de travail intelligent & Agenda Pro</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <input type="date" id="selectedDatePicker" class="bg-black/50 border border-white/10 text-xs text-white rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
      <button id="quickOptimizeBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 transition">
        <span class="animate-pulse">✨</span>
        <span class="hidden md:inline">Optimiser (IA)</span>
      </button>
    </div>
  </header>

  <!-- Dashboard Principal : Layout 2/3 Gauche & 1/3 Droite -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- ZONE GAUCHE (2/3) : Tâches, Notes & Checklists -->
    <section class="lg:col-span-8 space-y-6">
      
      <!-- Stats / Récapitulatif rapide -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <div class="app-card p-4 rounded-2xl flex items-center justify-between">
          <div>
            <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Temps Planifié</div>
            <div id="statWork" class="text-xl font-black text-indigo-400 mt-1">0h 00m</div>
          </div>
          <div class="text-2xl">💼</div>
        </div>
        <div class="app-card p-4 rounded-2xl flex items-center justify-between">
          <div>
            <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Tâches en Attente</div>
            <div id="statPending" class="text-xl font-black text-amber-400 mt-1">0</div>
          </div>
          <div class="text-2xl">⏳</div>
        </div>
        <div class="app-card p-4 rounded-2xl flex items-center justify-between col-span-2 md:col-span-1">
          <div>
            <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Statut Pronote</div>
            <div id="statPronote" class="text-xs font-bold text-emerald-400 mt-2">Prêt pour synchro</div>
          </div>
          <div class="text-2xl">🎓</div>
        </div>
      </div>

      <!-- Banque de Tâches & Formulaire -->
      <div class="app-card rounded-2xl p-6 space-y-4">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
          <h2 class="text-base font-bold text-white flex items-center gap-2">🎯 Banque de Tâches & Projets</h2>
          <span class="text-xs text-slate-400">Placer dans l'agenda à droite ➔</span>
        </div>

        <form id="fullTaskForm" class="grid grid-cols-1 md:grid-cols-5 gap-3 bg-black/30 p-3.5 rounded-xl border border-white/10">
          <div class="md:col-span-2">
            <input type="text" id="fullTaskTitle" required placeholder="Nom du devoir, projet, révision..." class="w-full bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <select id="fullTaskDuration" class="w-full bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none">
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="45">45 min</option>
              <option value="60" selected>1 heure</option>
              <option value="90">1h 30m</option>
              <option value="120">2 heures</option>
            </select>
          </div>
          <div>
            <select id="fullTaskPriority" class="w-full bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none">
              <option value="haute">🔥 Haute</option>
              <option value="moyenne" selected>⚡ Moyenne</option>
              <option value="basse">🌱 Basse</option>
            </select>
          </div>
          <div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-2 rounded-lg transition">+ Ajouter</button>
          </div>
        </form>

        <div id="fullTasksContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[220px] overflow-y-auto pr-1"></div>
      </div>

      <!-- Section double : Notes & Checklist Flash -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <!-- Bloc Notes -->
        <div class="md:col-span-7 app-card rounded-2xl p-6 space-y-3">
          <div class="flex justify-between items-center border-b border-white/10 pb-3">
            <h2 class="text-base font-bold text-white flex items-center gap-2">📝 Bloc-Notes</h2>
            <span id="noteSaveStatus" class="text-[10px] text-emerald-400 font-mono">Autosaved ✓</span>
          </div>
          <textarea id="quickNotesArea" placeholder="Notes rapides, brouillon ou rappel de cours..." class="w-full h-44 bg-black/30 border border-white/10 rounded-xl p-3.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 resize-none leading-relaxed"></textarea>
        </div>

        <!-- Checklist Flash -->
        <div class="md:col-span-5 app-card rounded-2xl p-6 space-y-3 flex flex-col">
          <div class="border-b border-white/10 pb-3">
            <h2 class="text-base font-bold text-white flex items-center gap-2">⚡ Actions Flash</h2>
          </div>
          <form id="quickCheckForm" class="flex gap-2">
            <input type="text" id="quickCheckInput" placeholder="Action rapide..." class="flex-1 bg-black/50 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">+</button>
          </form>
          <ul id="quickChecklist" class="space-y-2 flex-1 overflow-y-auto max-h-[140px] pr-1"></ul>
        </div>

      </div>

    </section>

    <!-- ZONE DROITE (1/3) : EMPLOI DU TEMPS TYPE GOOGLE CALENDAR / PRONOTE -->
    <aside class="lg:col-span-4 space-y-4">
      <div class="app-card rounded-2xl p-5 space-y-4 sticky top-20">
        
        <div class="flex justify-between items-center pb-3 border-b border-white/10">
          <div>
            <h2 class="text-base font-bold text-white flex items-center gap-2">📆 Emploi du Temps</h2>
            <p id="dayLabel" class="text-xs text-slate-400 font-medium mt-0.5">Aujourd'hui</p>
          </div>
          <button id="addFixedScheduleBtn" class="bg-white/10 hover:bg-white/20 text-xs text-sky-300 px-3 py-1.5 rounded-lg border border-white/10 transition">+ Horaire</button>
        </div>

        <!-- Grille Style Timeline Google Calendar / Pronote -->
        <div id="timelineGrid" class="space-y-2 max-h-[calc(100vh-220px)] overflow-y-auto pr-1"></div>

        <div class="pt-2 border-t border-white/10 flex justify-between items-center">
          <button id="clearTimelineBtn" class="text-[11px] text-rose-400 hover:underline">Effacer le jour</button>
          <button id="openPronoteSyncBtn" class="text-[11px] text-sky-400 hover:underline flex items-center gap-1">🔄 Synchro Pronote</button>
        </div>

      </div>
    </aside>

  </main>

  <script src="./app.js?v=5"></script>
</body>
</html>
