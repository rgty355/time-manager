<!-- VOLET 4 : SETTINGS / PRONOTE / RGB -->
<section id="viewSettings" class="hidden space-y-6">
  <div class="app-card rounded-2xl p-6 space-y-5 border-sky-500/30">
    <div class="flex items-center gap-3 border-b border-white/10 pb-4">
      <div class="p-2.5 rounded-xl bg-sky-500/20 text-sky-400 font-bold text-xl border border-sky-500/30">🎓</div>
      <div>
        <h3 class="text-base font-bold text-white">Synchronisation Pronote</h3>
        <p class="text-xs text-slate-400">Importe tes cours automatiquement via fichier agenda (.ics)</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Import ICS -->
      <div class="bg-black/40 border border-white/10 p-4 rounded-xl space-y-3">
        <h4 class="text-xs font-bold text-sky-300 flex items-center gap-2"><span>📅</span> Import Fichier iCal / Agenda (.ics)</h4>
        <p class="text-[11px] text-slate-400">Télécharge ton fichier <code>.ics</code> depuis Pronote et sélectionne-le :</p>
        <input type="file" id="icsFileInput" accept=".ics" class="w-full text-xs text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-600/20 file:text-sky-300 hover:file:bg-sky-600/30">
      </div>

      <!-- Import Texte -->
      <div class="bg-black/40 border border-white/10 p-4 rounded-xl space-y-3">
        <h4 class="text-xs font-bold text-sky-300 flex items-center gap-2"><span>📋</span> Copier-Coller Texte Pronote</h4>
        <textarea id="pronoteRawImport" placeholder="Ex: 08h00 - 09h00 : MATHS" class="w-full h-16 bg-black/50 border border-white/10 rounded-lg p-2 text-xs text-white focus:outline-none resize-none"></textarea>
        <button id="importPronoteTextBtn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium text-xs py-1.5 rounded-lg transition">Importer le texte</button>
      </div>
    </div>
  </div>
</section>
